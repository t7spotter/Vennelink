services:
  postgres:
    image: reg1.sijaam.com/devops/base/postgres:17
    container_name: vennelink_postgres

    restart: unless-stopped

    env_file:
      - ./env/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - vennelink

    stop_grace_period: 60s

  app:
    image: reg2.sijaam.com/dev/backend/vennelink_back:dev
    container_name: vennelink_backend

    restart: unless-stopped
    init: true

    env_file:
      - ./env/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8010:8000"

    volumes:
      - static:/app/staticfiles

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),timeout=3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    networks:
      - vennelink

    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: reg2.sijaam.com/dev/backend/vennelink_web:dev
    container_name: vennelink_frontend

    restart: unless-stopped
    init: true

    env_file:
      - ./env/.env

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "3010:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - vennelink

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  vennelink:
    driver: bridge

volumes:
  postgres_data:
  static: