# No credentials hardcoded: everything below is provided by `.env` (see
# .env.example). Only the app container is exposed to the host/proxy --
# Postgres is never published.

services:
  app:
    build: .
    env_file: .env
    # Point Django's DB object at the Postgres service defined below,
    # regardless of what the host machine's DB_* settings are.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shortener}
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # True readiness for web's depends_on: gunicorn only binds after
    # migrate + collectstatic finish, and web server-components need a
    # reachable Django on their very first request (otherwise the landing
    # page throws ApiError: backend unreachable until app is up).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/webapi/csrf/', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      # Loopback only: the React web service is the public origin; Django is
      # reachable locally for ops (admin, API, debugging), never from outside.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - static:/app/staticfiles

  web:
    # The public UI: React (Next.js) on port 3000. next.config.ts proxies
    # everything the React app doesn't handle to Django, so this one origin
    # serves the whole site with working session cookies and CSRF.
    build:
      context: .
      target: web-runtime
      # Next serializes rewrites at build time, so the backend target is
      # baked in; DJANGO_BACKEND_URL is also read at runtime for server
      # components (both must match this value unless rebuilt).
      args:
        DJANGO_BACKEND_URL: ${DJANGO_BACKEND_URL:-http://app:8000}
    environment:
      # Server components + the same-origin rewrite proxy target Django.
      DJANGO_BACKEND_URL: ${DJANGO_BACKEND_URL:-http://app:8000}
    restart: unless-stopped
    depends_on:
      # Wait for Django to actually serve, not just to have started --
      # starting with the container guarantees boot-time 500s otherwise.
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', r => { process.exit(r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${WEB_PORT:-3000}:3000"

  postgres:
    image: postgres:14.4
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  static:
