stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

  auto_cancel:
    on_new_commit: conservative

variables:
  DOCKER_HOST: "tcp://$RUNNER1"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

  DEV_APP_PATH: "/opt/app/backend/vennelink"

  DEV_BACK_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_back:dev"
  DEV_WEB_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_web:dev"

  PROD_BACK_REPO: "reg2.sijaam.com/backend/vennelink_back"
  PROD_WEB_REPO: "reg2.sijaam.com/backend/vennelink_web"

.docker_build:
  stage: build
  image: reg1.sijaam.com/devops/base/docker:dind

  before_script:
    - |
      set -eu

      echo "Logging in to REG1..."

      printf '%s' "$REG1_PASS" |
        docker login reg1.sijaam.com \
          -u "$REG1_USER" \
          --password-stdin

      echo "Logging in to REG2..."

      printf '%s' "$REG2_PASS" |
        docker login reg2.sijaam.com \
          -u "$REG2_USER" \
          --password-stdin

build_dev:
  extends: .docker_build

  resource_group: vennelink-dev-build

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  script:
    - |
      set -eu

      DOCKERFILE="devops/dockerfile-dev"

      test -f "$DOCKERFILE" || {
        echo "ERROR: Missing $DOCKERFILE"
        exit 1
      }

      echo "Building DEV Backend..."

      docker build \
        --pull \
        --target backend \
        -f "$DOCKERFILE" \
        -t "$DEV_BACK_IMAGE" \
        .

      echo "Building DEV Web..."

      docker build \
        --pull \
        --target web \
        -f "$DOCKERFILE" \
        -t "$DEV_WEB_IMAGE" \
        .

      echo "Pushing DEV Backend..."

      docker push "$DEV_BACK_IMAGE"

      echo "Pushing DEV Web..."

      docker push "$DEV_WEB_IMAGE"

      echo "DEV images pushed successfully."

build_production:
  extends: .docker_build

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - |
      set -eu

      DOCKERFILE="devops/dockerfile-master"

      test -f "$DOCKERFILE" || {
        echo "ERROR: Missing $DOCKERFILE"
        exit 1
      }

      BACK_IMAGE="${PROD_BACK_REPO}:${CI_PIPELINE_IID}"
      WEB_IMAGE="${PROD_WEB_REPO}:${CI_PIPELINE_IID}"

      echo "Building Production Backend..."

      docker build \
        --pull \
        --target backend \
        -f "$DOCKERFILE" \
        -t "$BACK_IMAGE" \
        .

      echo "Building Production Web..."

      docker build \
        --pull \
        --target web \
        -f "$DOCKERFILE" \
        -t "$WEB_IMAGE" \
        .

      echo "Pushing Production Backend..."

      docker push "$BACK_IMAGE"

      echo "Pushing Production Web..."

      docker push "$WEB_IMAGE"

      echo "Production images:"
      echo "$BACK_IMAGE"
      echo "$WEB_IMAGE"

      echo "Build and Push completed."
      echo "No production deployment will run."

deploy_dev:
  stage: deploy

  image: reg1.sijaam.com/devops/base/python:3.12-slim

  needs:
    - build_dev

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  resource_group: vennelink-dev-deploy

  before_script:
    - |
      set -eu

      echo "Installing SSH client..."

      apt-get update

      DEBIAN_FRONTEND=noninteractive apt-get install \
        -y --no-install-recommends \
        openssh-client ca-certificates

      echo "Configuring SSH..."

      mkdir -p "$HOME/.ssh"
      chmod 700 "$HOME/.ssh"

      if [ -f "$DEV_KEY" ]; then
        cp "$DEV_KEY" "$HOME/.ssh/id_ed25519"
      else
        printf '%s\n' "$DEV_KEY" |
          tr -d '\r' > "$HOME/.ssh/id_ed25519"
      fi

      chmod 600 "$HOME/.ssh/id_ed25519"

      ssh-keygen -y \
        -f "$HOME/.ssh/id_ed25519" > /dev/null

      if [ -n "${DEV_KNOWN_HOSTS:-}" ]; then
        if [ -f "$DEV_KNOWN_HOSTS" ]; then
          cp "$DEV_KNOWN_HOSTS" \
            "$HOME/.ssh/known_hosts"
        else
          printf '%s\n' "$DEV_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
        fi
      else
        echo "ERROR: DEV_KNOWN_HOSTS is missing"
        exit 1
      fi

      chmod 600 "$HOME/.ssh/known_hosts"


  script:
    - |
      set -eu

      REMOTE="${DEV_USER:-root}@${DEV}"
      SSH_PORT="${DEV_SSH_PORT:-22}"
      APP_PATH="$DEV_APP_PATH"

      ssh_remote() {
        ssh \
          -i "$HOME/.ssh/id_ed25519" \
          -p "$SSH_PORT" \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          "$REMOTE" "$@"
      }

      echo "Checking source Compose..."

      test -s devops/docker-compose-dev.yml

      echo "Checking SSH connection..."

      ssh_remote "echo SSH_CONNECTED"

      echo "Checking remote project..."

      ssh_remote "test -d '$APP_PATH/env'"

      echo "Uploading Docker Compose only..."

      scp \
        -i "$HOME/.ssh/id_ed25519" \
        -P "$SSH_PORT" \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        devops/docker-compose-dev.yml \
        "$REMOTE:$APP_PATH/docker-compose-dev.yml"

      echo "Registry login on DEV server..."

      printf '%s' "$REG2_PASS" |
        ssh_remote \
          "docker login reg2.sijaam.com -u '$REG2_USER' --password-stdin"

      echo "Running DEV deployment..."

      ssh_remote \
        "APP_PATH='$APP_PATH' sh -se" <<'REMOTE_SCRIPT'
      set -eu

      cd "$APP_PATH"

      COMPOSE="docker-compose-dev.yml"

      echo "Checking environment file..."

      test -s env/.env || {
        echo "ERROR: env/.env is missing"
        exit 1
      }

      echo "Validating Docker Compose..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        config --quiet

      echo "Pulling updated application images..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        pull app web

      echo "Starting PostgreSQL..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        up -d postgres

      echo "Deploying Django Backend..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        up -d --no-deps --force-recreate app

      echo "Waiting for Backend health..."

      backend_ready=0

      for i in $(seq 1 30); do
        status=$(docker inspect \
          --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
          vennelink_backend)

        if [ "$status" = "healthy" ]; then
          backend_ready=1
          break
        fi

        if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
          break
        fi

        sleep 5
      done

      if [ "$backend_ready" -ne 1 ]; then
        echo "ERROR: Backend healthcheck failed"
        docker logs vennelink_backend --tail 100
        exit 1
      fi

      echo "Deploying Next.js Web..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        up -d --no-deps --force-recreate web

      echo "Checking containers..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        ps

      echo "Checking frontend..."

      frontend_ready=0

      for i in $(seq 1 20); do
        status=$(docker inspect \
          --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
          vennelink_frontend)

        if [ "$status" = "healthy" ]; then
          frontend_ready=1
          break
        fi

        if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
          break
        fi

        sleep 5
      done

      if [ "$frontend_ready" -ne 1 ]; then
        echo "ERROR: Frontend healthcheck failed"
        docker logs vennelink_frontend --tail 100
        exit 1
      fi

      echo "DEV deployment completed successfully."

      REMOTE_SCRIPT