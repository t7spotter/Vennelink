stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

variables:
  DOCKER_HOST: "tcp://$RUNNER1"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"

  # Backend Dockerfiles
  DEV_BACK_DOCKERFILE: "devops/dockerfile-dev"
  PROD_BACK_DOCKERFILE: "devops/dockerfile-master"

  # Dedicated frontend Dockerfile
  WEB_DOCKERFILE: "frontend/Dockerfile"

  # Development images
  DEV_BACK_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_back:dev"
  DEV_WEB_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_web:dev"

  # Production repositories
  PROD_BACK_REPO: "reg2.sijaam.com/backend/vennelink_back"
  PROD_WEB_REPO: "reg2.sijaam.com/backend/vennelink_web"

  # DEV server
  DEV_APP_PATH: "/opt/app/backend/vennelink"

# ==========================================
# SHARED DOCKER BUILD
# ==========================================

.docker_build:
  stage: build
  image: reg1.sijaam.com/devops/base/docker:dind

  before_script:
    - |
      set -eu

      printf '%s' "$REG1_PASS" |
        docker login reg1.sijaam.com \
          -u "$REG1_USER" \
          --password-stdin

      printf '%s' "$REG2_PASS" |
        docker login reg2.sijaam.com \
          -u "$REG2_USER" \
          --password-stdin

  script:
    - |
      set -eu

      test -f "$BUILD_DOCKERFILE" || {
        echo "ERROR: Missing Dockerfile: $BUILD_DOCKERFILE"
        exit 1
      }

      echo "Building $TARGET_IMAGE"

      docker build \
        --pull \
        -f "$BUILD_DOCKERFILE" \
        -t "$TARGET_IMAGE" \
        "$BUILD_CONTEXT"

      echo "Pushing $TARGET_IMAGE"

      docker push "$TARGET_IMAGE"

      echo "Image pushed successfully"

# ==========================================
# DEVELOPMENT BACKEND
# ==========================================

build_dev_backend:
  extends: .docker_build

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  variables:
    BUILD_DOCKERFILE: "devops/dockerfile-dev"
    BUILD_CONTEXT: "."
    TARGET_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_back:dev"

# ==========================================
# DEVELOPMENT WEB
# ==========================================

build_dev_web:
  extends: .docker_build

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  variables:
    BUILD_DOCKERFILE: "frontend/Dockerfile"
    BUILD_CONTEXT: "./frontend"
    TARGET_IMAGE: "reg2.sijaam.com/dev/backend/vennelink_web:dev"

# ==========================================
# PRODUCTION BACKEND
# ==========================================

build_prod_backend:
  stage: build
  image: reg1.sijaam.com/devops/base/docker:dind

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  before_script:
    - |
      set -eu

      printf '%s' "$REG1_PASS" |
        docker login reg1.sijaam.com \
          -u "$REG1_USER" \
          --password-stdin

      printf '%s' "$REG2_PASS" |
        docker login reg2.sijaam.com \
          -u "$REG2_USER" \
          --password-stdin

  script:
    - |
      set -eu

      test -f "$PROD_BACK_DOCKERFILE" || {
        echo "ERROR: Missing $PROD_BACK_DOCKERFILE"
        exit 1
      }

      IMAGE="${PROD_BACK_REPO}:${CI_PIPELINE_IID}"

      docker build \
        --pull \
        -f "$PROD_BACK_DOCKERFILE" \
        -t "$IMAGE" \
        .

      docker push "$IMAGE"

      echo "Production backend image: $IMAGE"

# ==========================================
# PRODUCTION WEB
# ==========================================

build_prod_web:
  stage: build
  image: reg1.sijaam.com/devops/base/docker:dind

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  before_script:
    - |
      set -eu

      printf '%s' "$REG1_PASS" |
        docker login reg1.sijaam.com \
          -u "$REG1_USER" \
          --password-stdin

      printf '%s' "$REG2_PASS" |
        docker login reg2.sijaam.com \
          -u "$REG2_USER" \
          --password-stdin

  script:
    - |
      set -eu

      test -f "$WEB_DOCKERFILE" || {
        echo "ERROR: Missing $WEB_DOCKERFILE"
        exit 1
      }

      IMAGE="${PROD_WEB_REPO}:${CI_PIPELINE_IID}"

      docker build \
        --pull \
        -f "$WEB_DOCKERFILE" \
        -t "$IMAGE" \
        ./frontend

      docker push "$IMAGE"

      echo "Production web image: $IMAGE"

# ==========================================
# AUTOMATIC DEVELOPMENT DEPLOY
# ==========================================

deploy_dev:
  stage: deploy
  image: reg1.sijaam.com/devops/base/python:3.12-slim

  needs:
    - build_dev_backend
    - build_dev_web

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  resource_group: vennelink-dev

  before_script:
    - |
      set -eu

      apt-get update

      DEBIAN_FRONTEND=noninteractive apt-get install \
        -y --no-install-recommends \
        openssh-client ca-certificates

      mkdir -p "$HOME/.ssh"
      chmod 700 "$HOME/.ssh"

      if [ -f "$DEV_KEY" ]; then
        cp "$DEV_KEY" "$HOME/.ssh/id_ed25519"
      else
        printf '%s\n' "$DEV_KEY" |
          tr -d '\r' > "$HOME/.ssh/id_ed25519"
      fi

      chmod 600 "$HOME/.ssh/id_ed25519"

      ssh-keygen -y \
        -f "$HOME/.ssh/id_ed25519" > /dev/null

      test -n "${DEV_KNOWN_HOSTS:-}" || {
        echo "ERROR: DEV_KNOWN_HOSTS is missing"
        exit 1
      }

      if [ -f "$DEV_KNOWN_HOSTS" ]; then
        cp "$DEV_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
      else
        printf '%s\n' "$DEV_KNOWN_HOSTS" \
          > "$HOME/.ssh/known_hosts"
      fi

      chmod 600 "$HOME/.ssh/known_hosts"

  script:
    - |
      set -eu

      REMOTE="${DEV_USER:-root}@${DEV}"
      SSH_PORT="${DEV_SSH_PORT:-22}"

      ssh_remote() {
        ssh \
          -i "$HOME/.ssh/id_ed25519" \
          -p "$SSH_PORT" \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          "$REMOTE" "$@"
      }

      echo "Checking SSH connection..."
      ssh_remote "echo SSH_CONNECTED"

      echo "Checking source Compose..."
      test -s devops/docker-compose-dev.yml

      echo "Preparing destination..."
      ssh_remote "mkdir -p '$DEV_APP_PATH'"

      echo "Copying Docker Compose only..."

      scp \
        -i "$HOME/.ssh/id_ed25519" \
        -P "$SSH_PORT" \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        devops/docker-compose-dev.yml \
        "$REMOTE:$DEV_APP_PATH/docker-compose-dev.yml"

      echo "Registry login..."

      printf '%s' "$REG2_PASS" |
        ssh_remote \
          "docker login reg2.sijaam.com -u '$REG2_USER' --password-stdin"

      echo "Deploying DEV..."

      ssh_remote \
        "APP_PATH='$DEV_APP_PATH' sh -se" <<'REMOTE_SCRIPT'
      set -eu

      cd "$APP_PATH"

      COMPOSE="docker-compose-dev.yml"

      test -s env/.env || {
        echo "ERROR: env/.env missing"
        exit 1
      }

      test -s "$COMPOSE" || {
        echo "ERROR: Docker Compose missing"
        exit 1
      }

      echo "Validating Compose..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        config --quiet

      echo "Pulling application images..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        pull app web

      echo "Updating services..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        up -d --remove-orphans --force-recreate

      echo "Checking containers..."

      docker compose \
        --env-file env/.env \
        -f "$COMPOSE" \
        ps

      REMOTE_SCRIPT

      echo "DEV deployment completed."